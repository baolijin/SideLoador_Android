plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scrcpy.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.scrcpy.bridge"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
